[Jev Triage - Untriaged Findings]
description = Every 10 minutes, send findings that have no Jev result yet (max 50 per run) to Jev and store the result.
search = `jev_findings` | search NOT [| inputlookup jev_triage_latest | where jev_status="ok" | fields event_id] | head 50 | jevtriage auto=true | `jev_persist`
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 0
is_visible = 1

[Jev Triage - Response Queue]
description = Works the queue of the "Jev Triage" response action: triages the findings of each detection run once they are indexed. Needed when the action is used on detections.
search = | jevqueue
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
is_visible = 1
schedule_window = 0
