[jev_findings]
definition = `notable` | eval _key=event_id
iseval = 0

[jev_kv_fields]
definition = _key event_id rule_name rule_title security_domain urgency src dest user risk_object jev_status jev_error jev_enrich_errors jev_disposition jev_disposition_raw jev_disposition_confidence jev_es_disposition jev_urgency jev_urgency_score jev_urgency_confidence jev_escalate jev_admin_activity jev_logic_mismatch jev_tactic jev_policy jev_state jev_answers jev_model jev_questions jev_version jev_time jev_latency_ms jev_enrich_ms jev_input_tokens jev_explanation jev_explain_status jev_explain_model jev_explain_lang jev_explain_time jev_explain_for jev_explain_ms jev_note_status jev_note_id jev_note_time jev_note_for jev_note_expl_for jev_prev_time jev_prev_disposition jev_prev_urgency jev_prev_had_explanation jev_rerun_count jev_rerun_by
iseval = 0

[jev_persist]
definition = eval _key=event_id | table `jev_kv_fields` | outputlookup append=true key_field=_key jev_triage_latest | fields - jev_answers | eval _time=jev_time | collect index=jev_triage sourcetype=jev:triage:result
iseval = 0

[jev_cloudtrail]
definition = index=* sourcetype=aws:cloudtrail
iseval = 0

[jev_endpoint]
definition = index=*
iseval = 0

[jev_explain(1)]
args = event_id
definition = inputlookup jev_triage_latest where event_id="$event_id$" | jevexplain | table `jev_kv_fields` | outputlookup append=true key_field=_key jev_triage_latest
iseval = 0

[jev_explain(2)]
args = event_id, lang
definition = inputlookup jev_triage_latest where event_id="$event_id$" | jevexplain lang=$lang$ | table `jev_kv_fields` | outputlookup append=true key_field=_key jev_triage_latest
iseval = 0

[jev_note(1)]
args = event_id
definition = inputlookup jev_triage_latest where event_id="$event_id$" | jevnote | table `jev_kv_fields` | outputlookup append=true key_field=_key jev_triage_latest
iseval = 0

[jev_note(2)]
args = event_id, lang
definition = inputlookup jev_triage_latest where event_id="$event_id$" | jevnote lang=$lang$ | table `jev_kv_fields` | outputlookup append=true key_field=_key jev_triage_latest
iseval = 0
