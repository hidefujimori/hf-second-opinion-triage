# Results written by `jevtriage persist=true` (dashboard re-run): one JSON event per triage result
[jev:triage:json]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "jev_time":\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 20
TRUNCATE = 200000

# Audit of support mode (| jevprompt): who changed which version of the Jev questions, when and why
[jev:prompt:audit]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "time":\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 20
