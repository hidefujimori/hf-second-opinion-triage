[id]
name = second_opinion_triage
version = 1.2.1

[install]
is_configured = 0
build = 74

[launcher]
author = HF (Hide Fujimori)
description = Second-opinion triage for Splunk Enterprise Security findings: suggested disposition and urgency from a decision model (TypeSafe Jev or a compatible model), compared with the ES AI SOC Analyst. Suggestions only.
version = 1.2.1

[ui]
is_visible = 1
label = HF Decision Model Triage and Second Opinion App
setup_view = jev_setup
# The app pages follow the user's Splunk theme (light or dark); without this Splunk shows them light only
supported_themes = light,dark

[package]
id = second_opinion_triage
check_for_updates = 1

[triggers]
reload.jev_triage = simple
