[jev_triage]
is_custom = 1
label = Second Opinion Triage
description = Suggest a disposition and urgency with TypeSafe Jev and store it (optionally as an ES Note). Does not change ES fields.
payload_format = json
python.version = python3
python.required = 3.9, 3.13
alert.execute.cmd = jev_triage_ar.py
alert.execute.cmd.arg.0 = --execute
ttl = 900
maxtime = 10m
param.write_note = 0
param.note_language =
param.wait_seconds = 300
param.auto_explain = 0
param.explain_min_urgency = high
param.explain_dispositions = TP,Undetermined
param._cam = {"category": ["Information Gathering"], "task": ["scan"], "subject": ["splunk.event"], "technology": [{"vendor": "TypeSafe", "product": "Jev"}], "supports_adhoc": true, "drilldown_uri": "/app/second_opinion_triage/jev_triage"}
