[jev_triage_latest]
field.jev_time = number
field.jev_disposition_confidence = number
field.jev_urgency_score = number
field.jev_explain_time = number
field.jev_prev_time = number
field.jev_rerun_count = number

# Adaptive Response requests from detections, worked by | jevqueue
[jev_triage_queue]
field.queued_time = number
field.done_time = number
field.wait_seconds = number

# Daily usage counters (one record per day and kind), written by the search commands
[jev_usage]
field.count = number
field.updated = number

# Support mode: edited versions of the Jev questions (written only by | jevprompt, admins)
[jev_prompt_versions]
field.created = number

# Support mode state (key support_mode) and the version in use per decision model (key active:questions:<model>)
[jev_prompt_state]
field.expires_at = number
field.enabled_at = number
field.applied_at = number
