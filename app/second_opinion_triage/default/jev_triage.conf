[jev]
# endpoint: TypeSafe Jev (default) or another server with the same System One API, e.g. llama.cpp
#   http://<host>:8081/v1/systemone (Kev-4B, Clef-Flash ...). The API key may be empty for a local server.
#   Accuracy was tuned on jev-1.13.0: re-check with your own findings before switching.
#   Tested alternative: Cloudflare Clef 27B (ggml-org/Clef-GGUF:Q4_K_M) with confidence_threshold = 0.45
#   (a slow server, e.g. a Mac: parallel = 1, timeout = 180). Clef-Flash and Kev were not good enough.
endpoint = https://api.typesafe.ai/v1/systemone
model = jev-1.13.0
questions_file = questions.json
confidence_threshold = 0.60
escalation_floor = 0.80
rollup_urgency_cap = high
order_check = true
timeout = 30
proxy =
# findings processed at the same time (1-8). Each uses one search slot at a time.
parallel = 4

[enrichment]
enabled = true
shared_entities = *.amazonaws.com,*.amazon.com,*.microsoft.com,*.office.com,*.google.com
max_facts = 12

[llm]
# provider = anthropic | openai | bedrock | gemini   (openai = any OpenAI-compatible endpoint incl. Ollama / Apple fm serve; gemini = Google Gemini API incl. Gemma 4)
provider = anthropic
# model id for the provider, e.g. a Claude model id for anthropic/bedrock, or the deployed model name for openai-compatible
model =
# endpoint: optional base URL (openai-compatible servers, Azure OpenAI, or a gateway)
endpoint =
# region: bedrock only
region =
# thinking_level: gemini -> thinkingLevel. Gemma 4 thinks by default (~9 s); "minimal" turns it off (~1 s). Leave empty for Gemini models.
#   openai -> reasoning_effort. Ollama: gemma4 / qwen3 need "none"; gpt-oss cannot stop thinking, use "low". Otherwise the thinking can use up max_tokens.
# Local examples: Ollama  provider = openai, endpoint = http://<host>:11434/v1, model = qwen2.5:14b-instruct
#                 Apple Foundation Models (macOS 27 fm serve --host 0.0.0.0)  provider = openai, endpoint = http://<mac>:1976/v1, model = system
thinking_level =
max_tokens = 600
timeout = 60
# language of the explanation: en (default) | ja (next phase)
language = en
proxy =

[es_note]
# language of the Note written to ES findings by | jevnote : en | ja
language = en

[manual]
# Defaults for "Run Second Opinion Triage" in the menu of an ES finding (workflow action, one click). The Setup page also
# copies them to the Second Opinion Triage response action (param.write_note, param.auto_explain).
# write the suggestion to ES as a Note after triage: true | false
write_note = false
# ask the LLM for an explanation after triage: true | false
explain = false

[limits]
# Daily limits for AUTOMATIC runs only (detections through the Adaptive Response queue, and the
# scheduled search "Second Opinion Triage - Untriaged Findings"). Manual actions are not limited.
# empty = no limit, 0 = none per day. A day is the server's local calendar day.
# Findings sent to Jev per day:
jev_auto_daily =
# LLM explanations made automatically per day (only when the response action asks for them):
llm_auto_daily = 100
