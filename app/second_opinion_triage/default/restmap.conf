# Calls the decision model and the LLM for this app's search commands, so analysts never receive the API keys
# (see bin/jev_call.py). Analysts need only the capability jev_triage_run (role jev_triage_user).
[script:second_opinion_triage_call]
match = /second_opinion_triage/call
script = jev_call.py
scripttype = persist
handler = jev_call.CallHandler
requireAuthentication = true
output_modes = json
passPayload = true
passSystemAuth = true
capability = jev_triage_run
python.version = python3
python.required = 3.9, 3.13
