# This app's own keys for its search commands, without giving analysts list_storage_passwords (see bin/jev_keys.py).
[script:second_opinion_triage_keys]
match = /second_opinion_triage/keys
script = jev_keys.py
scripttype = persist
handler = jev_keys.KeysHandler
requireAuthentication = true
output_modes = json
passPayload = true
passSystemAuth = true
capability = jev_triage_run
python.version = python3
python.required = 3.9, 3.13
