# Role for people who use Second Opinion Triage without being admins (add it to your analyst roles).
# jev_triage_run lets the search commands get this app's Jev / LLM keys through the app's endpoint
# (/services/second_opinion_triage/keys, restmap.conf). It does not give access to other credentials:
# list_storage_passwords is not needed (it would let a user read every credential shared with everyone).
[capability::jev_triage_run]

[role_jev_triage_user]
importRoles =
jev_triage_run = enabled
