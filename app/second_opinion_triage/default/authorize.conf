# Role for people who use Second Opinion Triage without being admins (add it to your analyst roles).
# list_storage_passwords lets the search commands read credentials; since Splunk 9 a user only sees the
# credentials whose ACL grants their role read access, and the Setup page grants read access on the
# Jev / LLM keys to this role only.
[role_jev_triage_user]
importRoles =
list_storage_passwords = enabled
